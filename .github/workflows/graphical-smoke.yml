name: Native nested-Niri graphical smoke

# Independent, slower release-confidence signal. Never extend or replace
# the required two-minute Core/IPC CI or the GTK compile/Clippy gate.
# This exercises real packaged Wayland pixels, not source/main visual parity.
on:
  push:
    branches: [native-gtk]
    paths:
      - ".github/workflows/graphical-smoke.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "crates/**"
      - "scripts/headless_wayland_acceptance.py"
      - "scripts/graphical_viewport_matrix.py"
      - "scripts/accept_nested.py"
      - "scripts/acceptance_scenarios.py"
      - "scripts/validate_nested_evidence.py"
      - "scripts/capture_native_motion.py"
      - "scripts/dev_preview.py"
      - "scripts/check_native_visual_smoke.py"
      - "scripts/visual_contract_checks.py"
  pull_request:
    branches: [native-gtk]
    paths:
      - ".github/workflows/graphical-smoke.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "crates/**"
      - "scripts/headless_wayland_acceptance.py"
      - "scripts/graphical_viewport_matrix.py"
      - "scripts/accept_nested.py"
      - "scripts/acceptance_scenarios.py"
      - "scripts/validate_nested_evidence.py"
      - "scripts/capture_native_motion.py"
      - "scripts/dev_preview.py"
      - "scripts/check_native_visual_smoke.py"
      - "scripts/visual_contract_checks.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-wayland-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-wayland-smoke:
    name: Package GTK Shell and verify genuine nested-Niri pixels
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build distributable native GTK desktop package
        run: nix build .#default -L
      - name: Validate real pixel predicates, not synthetic screenshot claims
        run: nix develop .#graphical-ci --command python3 scripts/visual_contract_checks.py -v
      - name: Validate 102 actual PNG frames across 800x600, 1280x800 and 1920x1080
        run: |
          nix develop .#graphical-ci --command python3 scripts/graphical_viewport_matrix.py \
            --package-dir result --output artifacts/virtual-niri
      # Each viewport receives an isolated outer Weston, nested Niri and D-Bus.
      # Real PNG sizes are verified against each requested viewport, not
      # merely inferred from the outer compositor CLI. Captures are private
      # and unreviewed; source/main parity still requires manual comparison.
      # The manual graphical.yml retains opt-in artifact uploads.
