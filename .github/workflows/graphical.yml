name: Manual nested-Niri graphical review

# Automatic source pushes already verify real pixels on the packaged GTK
# output in ci.yml. Do not start an independent second Nix build.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "34-frame smoke or 104-frame manual motion review"
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - full
      upload_evidence:
        description: "Upload actual PNGs for review (default: no)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: manual-graphical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nested-wayland:
    name: Manual isolated Niri graphics
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the packaged GTK Shell once
        run: nix build .#default -L
      - name: Test pixel predicates
        run: nix develop .#graphical-ci --command python3 scripts/visual_contract_checks.py -v
      - name: Capture and validate real nested-Niri frames
        run: |
          nix develop .#graphical-ci --command python3 scripts/headless_wayland_acceptance.py \
            --package-dir result --output artifacts/virtual-niri \
            --profile "${{ inputs.profile }}" --width 1280 --height 800
      - name: Upload unreviewed frames only with explicit opt-in
        if: ${{ inputs.upload_evidence }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-native-niri-${{ github.run_id }}
          path: artifacts/virtual-niri/
          if-no-files-found: error
          retention-days: 2
