name: Full native GTK/Nix/Wayland validation (manual)

# Slow UI/release acceptance, consciously outside the fast 2-minute CI.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "34-frame smoke or 104-frame detailed motion review"
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - full
      upload_evidence:
        description: "Upload actual PNGs for review (default: no)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: native-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full GTK, Nix, D-Bus and nested-Niri gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Clippy and test the entire Rust workspace including GTK
        run: |
          nix develop .#ci --command bash -euo pipefail -c '
            cargo clippy --locked --workspace --all-targets -- -D warnings
            cargo test --locked --workspace --all-targets
          '
      - name: Build the actual distributable Nix package
        run: nix build .#default -L
      - name: Smoke external display rollback with isolated fake Niri
        run: nix develop .#ci --command python3 scripts/smoke_display_supervisor.py --shell result/bin/kira-shell
      - name: Smoke real SNI on private D-Bus
        run: nix develop .#ci --command python3 scripts/smoke_sni_fixture_bus.py --fixture result/bin/kira-sni-acceptance
      - name: Smoke dual-peer Notifications on private D-Bus
        run: nix develop .#ci --command python3 scripts/smoke_notification_policy_bus.py --fixture result/bin/kira-notification-policy-fixture --probe result/bin/kira-notification-acceptance
      - name: Test native visual pixel predicates
        run: nix develop .#graphical-ci --command python3 scripts/visual_contract_checks.py -v
      - name: Capture and validate real nested-Niri frames
        run: |
          nix develop .#graphical-ci --command python3 scripts/headless_wayland_acceptance.py \
            --package-dir result --output artifacts/virtual-niri \
            --profile "${{ inputs.profile }}" --width 1280 --height 800
      - name: Upload real unreviewed PNGs only with explicit opt-in
        if: ${{ inputs.upload_evidence }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-native-niri-${{ github.run_id }}
          path: artifacts/virtual-niri/
          if-no-files-found: error
          retention-days: 2
