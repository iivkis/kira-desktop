name: Temporary review exact paint rustfmt
on:
  push:
    branches: [feat/notifications-fifo-toast]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'iivkis/kira-desktop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/kira-shell/src/notifications.rs
            git commit -m "style(notifications): format validated ACK and D-Bus gate"
            git push
          fi
