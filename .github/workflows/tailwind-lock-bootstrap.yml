name: Tailwind migration lockfile bootstrap (temporary)
on:
  push:
    branches: [feat/neo-editorial-shell]
permissions:
  contents: write
jobs:
  lockfile:
    if: "contains(github.event.head_commit.message, 'bootstrap Tailwind lockfile')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and verify Tailwind v4 lockfile
        run: |
          npm install --prefix frontend --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
          npm run check --prefix frontend
          npm run test:ci --prefix frontend
          npm run build --prefix frontend
      - name: Commit generated lockfile back to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git diff --cached --quiet && exit 1
          git commit -m "chore(frontend): lock verified Tailwind CSS v4 dependencies"
          git push origin HEAD:refs/heads/feat/neo-editorial-shell
