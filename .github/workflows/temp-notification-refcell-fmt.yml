name: Temporary rustfmt after GTK reentrancy review
on:
  push:
    branches: [feat/notifications-fifo-toast]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format native Rust
        run: cargo fmt --all
      - name: Push formatter result
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/kira-shell/src/notification_queue.rs crates/kira-shell/src/notifications.rs
            git commit -m "style(notifications): format borrow-scope review fixes"
            git push
          fi
