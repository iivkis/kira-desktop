name: NixOS integration

# Validate GTK API compatibility before the slow release package build.
# The native check uses the development profile to report type errors early,
# while the package build still validates the full distributed artifact.
on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - scripts/**
      - tests/**
      - Taskfile.yml
      - frontend/**
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - scripts/**
      - tests/**
      - frontend/**
      - Taskfile.yml
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions:
  contents: read

# A newer commit supersedes a previous build of the same branch.
concurrency:
  group: nix-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  package:
    name: Flake, nested Niri config and native Core/Shell package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # nix develop uses sccache as RUSTC_WRAPPER; persist its directory across runs.
      SCCACHE_DIR: ${{ github.workspace }}/.cache/kira-sccache
      SCCACHE_CACHE_SIZE: 2G
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # Persist Nix store outputs (including Crane's third-party Rust artifacts)
      # between fresh GitHub runners. A miss still builds normally.
      - name: Cache Nix store
        id: nix-cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-v1-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'frontend/package-lock.json') }}
          restore-prefixes-first-match: nix-v1-${{ runner.os }}-
          gc-max-store-size-linux: 3G

      # Cache the developer-shell Cargo check/test compiler outputs separately.
      # Crane's sandboxed nix build is served by the Nix store cache above.
      - name: Cache native Rust compiler outputs
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-v1-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-keys: |
            sccache-v1-${{ runner.os }}-

      # Optional cache, disabled unless repo owner sets a cache name.
      # Uploads only from trusted pushes to main; PRs can read shared outputs.
      - name: Shared Nix cache (opt-in)
        if: ${{ vars.KIRA_CACHIX_NAME != '' }}
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.KIRA_CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
      - name: Check flake outputs
        run: nix flake check --no-build
      - name: Validate nested Niri preview config
        run: nix develop --command python3 scripts/dev_preview.py --validate-config
      - name: Build packaged Tailwind frontend and verify npm lock/hash first
        run: nix build .#frontend -L --show-trace
      # One compilation of the test profile also type-checks the native Shell.
      # Running a separate cargo check first recompiles GTK/WebKit dependencies.
      - name: Compile and run all native Shell tests once
        run: nix develop --command cargo test --locked -p kira-shell -- --nocapture
      - name: Compile packaged Core, GTK/WebKit Shell and frontend (reuses Crane cargoArtifacts)
        run: nix build .#default -L --show-trace
