name: Nix package (nightly / manual)

# ci.yml builds the package for every native source change. The standalone
# package workflow remains manually available without an extra nightly build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build native GTK4 Nix package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Rust-only package
        run: nix build .#default -L
