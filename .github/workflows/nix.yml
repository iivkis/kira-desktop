name: NixOS integration

# Native GTK/WebKit compilation is tested by building the actual package.
# Called from CI so fast Core/TS checks alone cannot declare the PR green.
# Do not compile the same heavy Rust bindings again in a separate cargo check.
# Invoked as a required job of CI. It can also be run manually for QA.
# Never claim CI green until the full GTK/WebKit Shell has compiled.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Flake, nested Niri config and native Core/Shell package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # Optional cache, disabled unless repo owner sets a cache name.
      # Uploads only from trusted pushes to main; PRs can read shared outputs.
      - name: Shared Nix cache (opt-in)
        if: ${{ vars.KIRA_CACHIX_NAME != '' }}
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.KIRA_CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
      - name: Check flake outputs
        run: nix flake check --no-build
      - name: Validate nested Niri preview config
        run: nix develop --command python3 scripts/dev_preview.py --validate-config
      - name: Compile packaged Core, GTK/WebKit Shell and frontend (reuses Crane cargoArtifacts)
        run: nix build .#default -L --show-trace
