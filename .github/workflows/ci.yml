name: Native GTK4 CI

on:
  pull_request:
  push:
    branches: [main, native-gtk]

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust Core and IPC
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format Core/IPC and run tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p kira-core -p kira-ipc --all-targets -- -D warnings
          cargo test --locked -p kira-core -p kira-ipc --all-targets
      - name: Validate native preview Python syntax
        run: python3 -m py_compile scripts/dev_preview.py
      - name: Verify removed web frontend
        run: |
          test ! -e frontend/package.json
          ! grep -q webkit6 crates/kira-shell/Cargo.toml

  native-shell:
    name: Native GTK4 shell
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check reusable GTK4 UI, services and desktop integration
        run: |
          nix develop .#ci --command cargo check --locked --workspace --all-targets
          nix develop .#ci --command cargo clippy --locked -p kira-ui -p kira-services -p kira-shell --all-targets -- -D warnings
          nix develop .#ci --command cargo test --locked -p kira-ui -p kira-services -p kira-shell --all-targets
      - name: Build distributable Nix package with embedded GTK CSS
        run: nix build .#default -L
