name: CI

on:
  push:
  pull_request:

# A trusted branch may receive a formatting-only commit before tests.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  # A newer commit supersedes checks of an obsolete branch snapshot.
  cancel-in-progress: true

jobs:
  check:
    name: Lightweight Core + Frontend checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # PR checkout's default synthetic merge commit is not pushable.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Autoformat Rust before tests
        run: cargo fmt --all

      - name: Commit and push rustfmt on first-party feature branches
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.head.ref != 'main')
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          if git diff --quiet --exit-code -- '*.rs'; then
            echo "rustfmt: no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: apply rustfmt (CI)"
          # A non-fast-forward push must fail, never overwrite newer work.
          # The token is scoped to this step, not persisted by checkout.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # Never rebase arbitrary branch changes inside CI. A newer branch
          # has its own checks and gets its own rustfmt opportunity.
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            fetch --no-tags origin "refs/heads/$TARGET_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$(git rev-parse HEAD^)" ]; then
            echo "::notice::Branch advanced; skip obsolete rustfmt push."
            exit 0
          fi
          if ! git -c http.extraheader="AUTHORIZATION: basic $auth" \
              push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
            echo "::notice::Branch advanced during push; newer CI will format it."
          fi

      - name: Check formatting only on main and external PRs
        if: >-
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || !startsWith(github.ref, 'refs/heads/'))) ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          if ! git diff --quiet --exit-code -- '*.rs'; then
            echo "::error::rustfmt required: CI cannot commit to main or a fork."
            git diff --stat
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Run code checks and tests
        run: task check

      - name: Compile Core
        run: cargo build --locked -p kira-core -p kira-ipc

      - name: Build static frontend assets
        run: task frontend:build

  # The separate nix.yml workflow validates the GTK/WebKit native Shell.
