name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lightweight Core + Frontend checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install --prefix frontend --no-audit --no-fund

      - name: Run code checks and tests
        run: task check

      - name: Compile Core
        run: cargo build -p kira-core -p kira-ipc

      - name: Build static frontend assets
        run: task frontend:build

  # GTK4 Layer Shell development libraries are not shipped by Ubuntu 24.04.
  # Add a separate Nix-based shell build job once Cargo.lock/flake.lock exist.
