name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Fast Core + Frontend checks (not native Shell)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Run code checks and tests
        run: task check

      - name: Compile Core
        run: cargo build --locked -p kira-core -p kira-ipc

      - name: Build static frontend assets
        run: task frontend:build

  # A green CI workflow must include the complete native GTK/WebKit Shell.
  # Run the existing Nix build as a reusable job rather than duplicating its
  # heavy Rust/GTK compilation in two independent workflows.
  native-shell:
    name: Native GTK/WebKit Shell build (required)
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/nix.yml
    secrets: inherit

  # GitHub's CI workflow stays in progress until BOTH jobs finish. A green
  # fast check alone is never enough to recommend a local preview or merge.
