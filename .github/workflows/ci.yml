name: Native GTK4 CI

# Fast required signal: two-minute job cap. This does not compile GTK/Nix.
# Run graphical.yml manually on the target SHA before claiming native readiness.
on:
  pull_request:
  push:
    branches: [main, native-gtk]

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust Core and IPC
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format Rust and lint/test Core and IPC
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p kira-core -p kira-ipc --all-targets -- -D warnings
          cargo test --locked -p kira-core -p kira-ipc --all-targets
      - name: Validate native preview and pinned widget parity contracts
        run: |
          python3 -m compileall -q scripts
          python3 scripts/check_widget_parity.py
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          test ! -e frontend/package.json
          ! grep -q webkit6 crates/kira-shell/Cargo.toml
