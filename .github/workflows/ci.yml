name: Native GTK4 CI

on:
  pull_request:
  push:
    branches: [main, native-gtk]

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust Core and IPC
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format Core/IPC and run tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p kira-core -p kira-ipc --all-targets -- -D warnings
          cargo test --locked -p kira-core -p kira-ipc --all-targets
      - name: Validate native preview and pinned widget parity contracts
        run: |
          python3 -m py_compile scripts/dev_preview.py scripts/capture_native_motion.py scripts/accept_nested.py scripts/acceptance_scenarios.py scripts/validate_nested_evidence.py scripts/private_bus.py scripts/smoke_sni_fixture_bus.py scripts/test_accept_nested.py scripts/test_acceptance_scenarios.py scripts/test_validate_nested_evidence.py scripts/test_preview_environment.py scripts/test_native_motion_capture.py scripts/check_widget_parity.py scripts/test_widget_parity.py
          python3 scripts/check_widget_parity.py
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Verify removed web frontend
        run: |
          test ! -e frontend/package.json
          ! grep -q webkit6 crates/kira-shell/Cargo.toml

  native-shell:
    name: Native GTK4 shell
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check reusable GTK4 UI, services and desktop integration
        run: |
          nix develop .#ci --command cargo check --locked --workspace --all-targets
          nix develop .#ci --command cargo clippy --locked -p kira-ui -p kira-services -p kira-shell --all-targets -- -D warnings
          nix develop .#ci --command cargo test --locked -p kira-ui -p kira-services -p kira-shell --all-targets
      - name: Build distributable Nix package with embedded GTK CSS
        run: nix build .#default -L
      - name: Smoke real SNI client against an isolated headless D-Bus
        run: nix develop .#ci --command python3 scripts/smoke_sni_fixture_bus.py --fixture result/bin/kira-sni-acceptance
