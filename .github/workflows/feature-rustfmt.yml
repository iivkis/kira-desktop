name: Feature branch rustfmt
on:
  push:
    branches:
      - feat/notifications-fifo-toast
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'iivkis/kira-desktop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format changed Rust code
        run: cargo fmt --all
      - name: Push formatting commit
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates
            git commit -m "style(notifications): cargo fmt"
            git push
          fi
