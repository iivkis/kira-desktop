<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181820" />
    <title>Kira Desktop</title>
    <script>
      // This inline handler still runs when external ES modules fail to load.
      window.addEventListener('error', (event) => {
        const message = String(event.message || 'Failed to load a UI asset');
        window.webkit?.messageHandlers?.kiraDiagnostics?.postMessage('error: ' + message);
      });
      window.addEventListener('unhandledrejection', (event) => {
        window.webkit?.messageHandlers?.kiraDiagnostics?.postMessage(
          'unhandled rejection: ' + String(event.reason)
        );
      });
      window.addEventListener('DOMContentLoaded', () => {
        window.setTimeout(() => {
          const pending = document.querySelector('#kira-loading');
          if (pending) pending.textContent = 'Kira UI did not start. Check terminal logs.';
        }, 2500);
      });
    </script>
  </head>
  <body>
    <div id="app">
      <div id="kira-loading" style="height:42px; display:flex; align-items:center; padding:0 14px; font:12px system-ui; background:#181820; color:#d1c4f5;">
        Kira Desktop · Loading interface…
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
