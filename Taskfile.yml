version: '3'

tasks:
  default:
    desc: Run native GTK4 branch checks.
    cmds:
      - task: check

  check:
    desc: Check source, Core/IPC tests and configuration.
    cmds:
      - task: spec:check
      - task: fmt
      - task: lint
      - task: test
      - task: config:check

  spec:check:
    desc: Assert native architecture sources exist and browser assets are absent.
    cmds:
      - test -s docs/ARCHITECTURE_NATIVE.md
      - test -s docs/MIGRATION_NATIVE_GTK.md
      - test -s docs/SPECIFICATION.md
      - test -s docs/DESIGN_SYSTEM.md
      - test -s crates/kira-shell/src/main.rs
      - test -s crates/kira-ui/src/lib.rs
      - test -s crates/kira-ui/src/style.css
      - test -s crates/kira-services/src/lib.rs
      - test ! -e frontend/package.json
      - "! grep -q 'webkit6' crates/kira-shell/Cargo.toml"

  fmt:
    desc: Verify Rust formatting.
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Lint native Rust crates.
    cmds:
      - cargo clippy --locked -p kira-ipc -p kira-core --all-targets -- -D warnings

  test:
    desc: Run Core/IPC regression tests.
    cmds:
      - cargo test --locked -p kira-ipc -p kira-core --all-targets

  config:check:
    desc: Validate sample KDL with Core.
    cmds:
      - cargo run --locked -p kira-core -- --check-config "{{.ROOT_DIR}}/config/kira.kdl.example"

  shell:check:
    desc: Check reusable kira-ui/services and desktop integration inside nix develop.
    cmds:
      - cargo check --locked --workspace --all-targets
      - cargo clippy --locked -p kira-ui -p kira-services -p kira-shell --all-targets -- -D warnings
      - cargo test --locked -p kira-ui -p kira-services -p kira-shell --all-targets

  core:run:
    cmds:
      - cargo run --locked -p kira-core

  shell:run:
    cmds:
      - cargo run --locked -p kira-shell

  build:
    cmds:
      - cargo build --locked --release --workspace

  dev:preview:
    desc: Safe isolated nested Niri with native GTK4 debug Shell.
    cmds:
      - cargo build --locked -p kira-core -p kira-shell
      - python3 scripts/dev_preview.py --bin-dir target/debug

  dev:preview:run:
    desc: Run existing debug binaries in isolated Niri.
    cmds:
      - python3 scripts/dev_preview.py --bin-dir target/debug

  dev:preview:debug:
    desc: Tail native Core/Shell output in isolated Niri.
    cmds:
      - python3 scripts/dev_preview.py --bin-dir target/debug --debug

  dev:preview:release:
    cmds:
      - task: nix:build
      - python3 scripts/dev_preview.py

  nix:check:
    cmds:
      - nix flake check

  nix:build:
    cmds:
      - nix build .#default
