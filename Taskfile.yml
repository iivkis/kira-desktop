version: '3'

tasks:
  default:
    desc: Run all currently applicable checks.
    cmds:
      - task: check

  check:
    desc: Validate repository, formatting, static analysis and tests.
    cmds:
      - task: spec:check
      - task: fmt
      - task: lint
      - task: test

  spec:check:
    desc: Verify the minimum documentation and infrastructure contract.
    cmds:
      - test -s README.md
      - test -s docs/SPECIFICATION.md
      - test -s flake.nix
      - test -s nix/package.nix
      - test -s Taskfile.yml
      - test -s .github/workflows/ci.yml

  fmt:
    desc: Check Rust formatting when the Rust workspace exists.
    cmds:
      - |
        if [ -f Cargo.toml ]; then
          cargo fmt --all -- --check
        else
          echo "Rust workspace is not initialized; skipping cargo fmt."
        fi

  lint:
    desc: Run Rust Clippy and frontend Svelte/TypeScript checks when available.
    cmds:
      - |
        if [ -f Cargo.toml ]; then
          cargo clippy --workspace --all-targets -- -D warnings
        else
          echo "Rust workspace is not initialized; skipping cargo clippy."
        fi
      - |
        if [ -f frontend/package.json ]; then
          npm run check --prefix frontend
        else
          echo "Frontend is not initialized; skipping TypeScript/Svelte check."
        fi

  test:
    desc: Run Rust and frontend automated tests when available.
    cmds:
      - |
        if [ -f Cargo.toml ]; then
          cargo test --workspace --all-targets
        else
          echo "Rust workspace is not initialized; skipping cargo test."
        fi
      - |
        if [ -f frontend/package.json ]; then
          npm run test:ci --prefix frontend
        else
          echo "Frontend is not initialized; skipping frontend tests."
        fi

  build:
    desc: Build both application layers once they exist.
    cmds:
      - |
        if [ ! -f Cargo.toml ] || [ ! -f frontend/package.json ]; then
          echo "Cannot build: Rust workspace and frontend have not been implemented."
          exit 1
        fi
        npm run build --prefix frontend
        cargo build --release --workspace

  nix:check:
    desc: Validate the Nix flake.
    cmds:
      - nix flake check

  nix:build:
    desc: Build the NixOS application package (not available before implementation).
    cmds:
      - nix build .#default
