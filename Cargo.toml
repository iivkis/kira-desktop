[workspace]
resolver = "2"
members = [
  "crates/kira-ipc",
  "crates/kira-core",
  "crates/kira-shell",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
